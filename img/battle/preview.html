<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>忍者バトル・素材プレビュー</title>
<style>body{margin:0;padding:24px;background:#eee9df;color:#223047;font:16px system-ui}main{max-width:1040px;margin:auto}h1{font-size:24px}label{display:inline-block;margin:8px 16px 8px 0}select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #b3a283;background:#fffaf0}section{display:flex;gap:28px;flex-wrap:wrap;align-items:start;margin-top:20px}.stage{position:relative;width:384px;height:384px;background-color:#e5e6df;background-image:linear-gradient(45deg,#cad0c3 25%,transparent 25%),linear-gradient(-45deg,#cad0c3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cad0c3 75%),linear-gradient(-45deg,transparent 75%,#cad0c3 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.stage canvas{width:384px;height:384px;image-rendering:pixelated}img{max-width:400px;max-height:640px;image-rendering:pixelated;background:#233046}p{line-height:1.7}#status{font-size:13px}a{color:#2f5e85}</style></head>
<body><main><h1>忍者バトル・素材プレビュー</h1><p>キャラごとのPNGと動きを確認できます。チェッカーは透過部分、足元の線は共通の基準点です。</p>
<label>キャラ <select id="character"><option value="hero1">忍者 Lv.1</option><option value="hero2">忍者 Lv.2</option><option value="hero3">忍者 Lv.3</option><option value="hero4">忍者 Lv.4</option><option value="ninja">敵忍者</option><option value="samurai">鎧武者</option><option value="oni">鬼</option><option value="tengu">天狗</option><option value="serpent">大蛇</option><option value="dragon">龍</option><option value="master">師範</option><option value="dummy">木人</option></select></label>
<label>動き <select id="pose"></select></label><button id="play" type="button">一時停止</button><button id="step" type="button">１コマ進める</button><label><input id="flip" type="checkbox">左向き</label>
<div id="status" role="status"></div><section><div><div class="stage"><canvas id="sprite" width="384" height="384" aria-label="選択したキャラのアニメーション"></canvas></div><p id="frame"></p></div><div><p><a id="download" href="#">元の透過PNGを開く</a></p><img id="source" alt="生成したスプライトシート"></div></section></main>
<script src="./js/21-battle-art.js"></script><script>
const character=document.getElementById('character'),pose=document.getElementById('pose'),canvas=document.getElementById('sprite'),ctx=canvas.getContext('2d');let playing=true,frame=0,last=0;
const names={idle:'待機',slash:'斬撃・攻撃',throw:'手裏剣',clone:'分身',hurt:'被弾',win:'納刀・勝利',smoke:'煙玉',defeat:'撃破',bow:'うなずき'};
function select(){const hero=character.value.startsWith('hero'),list=hero?['idle','slash','throw','clone','hurt','win','smoke']:['idle','slash','hurt','defeat','bow'];pose.innerHTML='';list.forEach(value=>{const o=document.createElement('option');o.value=value;o.textContent=names[value];pose.append(o);});const file='./img/battle/'+(hero?'hero-'+character.value.slice(-1):character.value)+'.png';document.getElementById('source').src=file;document.getElementById('download').href=file;frame=0;draw();}
function draw(){const hero=character.value.startsWith('hero'),kind=hero?'hero':character.value,stage=hero?Number(character.value.slice(-1)):1;ctx.clearRect(0,0,384,384);NinjaBattleArt.draw(ctx,kind,stage,pose.value,frame,0,0,6,document.getElementById('flip').checked);ctx.fillStyle='#638867';ctx.fillRect(0,58*6,384,1);document.getElementById('frame').textContent=names[pose.value]+'・'+(frame+1)+' / 4';document.getElementById('status').textContent='素材：'+(NinjaBattleArt.status()[kind+stage]==='ready'?'生成PNG':'読込中／フォールバック');}
function tick(now){if(playing&&now-last>=220){frame=(frame+1)%4;last=now;draw();}requestAnimationFrame(tick);}character.onchange=select;pose.onchange=()=>{frame=0;draw()};document.getElementById('flip').onchange=draw;document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'一時停止':'再生'};document.getElementById('step').onclick=()=>{playing=false;document.getElementById('play').textContent='再生';frame=(frame+1)%4;draw()};window.addEventListener('ninja-battle-art-ready',draw);select();requestAnimationFrame(tick);
</script><script src="./js/battle-preview.js"></script></body></html>
